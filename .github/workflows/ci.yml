name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  specs:
    name: Validate OpenSpec Specs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Validate specs
        run: npx -y @fission-ai/openspec@latest validate --specs

  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Zig
        uses: mlugg/setup-zig@v2

      - name: Set up Task
        uses: arduino/setup-task@v2

      - name: Build
        run: task build

      - name: Test
        run: task test

  publish:
    name: Publish Binary
    needs: build-and-test
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    strategy:
      matrix:
        include:
          - target: x86_64-linux-gnu
            suffix: linux-amd64
          - target: aarch64-linux-gnu
            suffix: linux-arm64
          - target: x86_64-macos
            suffix: darwin-amd64
          - target: aarch64-macos
            suffix: darwin-arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Zig
        uses: mlugg/setup-zig@v2

      - name: Cross-compile
        run: zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseFast

      - name: Stage artifact
        run: cp zig-out/bin/curation curation-${{ matrix.suffix }}

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: curation-${{ matrix.suffix }}
          body: "Release ${{ github.ref_name }}"
