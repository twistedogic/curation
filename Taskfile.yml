version: '3'

vars:
  OPTIMIZE: '{{.OPTIMIZE | default "Debug"}}'

tasks:
  build:
    desc: Build the curation binary
    cmds:
      - zig build -Doptimize={{.OPTIMIZE}}

  install:
    desc: Build (ReleaseFast) and install the binary to PREFIX/bin (default $HOME/.local)
    vars:
      PREFIX: '{{.PREFIX | default (printf "%s/.local" (env "HOME"))}}'
    cmds:
      - zig build -Doptimize=ReleaseFast
      - install -d {{.PREFIX}}/bin
      - install -m 0755 zig-out/bin/curation {{.PREFIX}}/bin/curation

  test:
    desc: Run tests
    cmds:
      - zig build test

  run:
    desc: Build and run with optional args (task run -- arg1 arg2)
    cmds:
      - zig build run {{.CLI_ARGS}}

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf zig-out .zig-cache

  validate:
    desc: Validate OpenSpec specs and changes (requires openspec CLI)
    cmds:
      - npx -y @fission-ai/openspec@latest validate --all
